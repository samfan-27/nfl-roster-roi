name: ETL - roster_roi update

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Daily refresh or explicit weekly cloud verification
        type: choice
        options: [refresh, weekly]
        default: refresh
      backfill:
        description: Refresh all seasons since 2021
        type: boolean
        default: false
  schedule:
    # Daily after roster and overnight stats updates; away from the busy hour.
    - cron: '23 16 * * *'

permissions:
  contents: read

concurrency:
  group: roster-roi-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKFILL: ${{ inputs.backfill || 'false' }}
      OPERATION: ${{ inputs.operation || 'refresh' }}
      CLOUD_PIPELINE_ENABLED: ${{ vars.CLOUD_PIPELINE_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify calculation and failure handling
        run: python -m pytest -q
      - name: Verify database availability before downloading NFL data
        run: python -m etl.healthcheck
      - name: Refresh current season or backfill
        run: |
          if [ "$OPERATION" = "weekly" ]; then
            python -m etl.cloud weekly
          elif [ "$BACKFILL" = "true" ]; then
            python -m etl.etl --auto --fresh
          else
            python -m etl.etl --fresh
          fi
      - name: Upload data and join audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roster-roi-artifacts
          path: artifacts/*.csv
          if-no-files-found: ignore
          retention-days: 14
