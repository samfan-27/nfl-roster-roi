name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Verify migration and transactional permissions in isolated Postgres
        run: |
          docker run --name nfl-roi-migration-test --rm -d -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          python scripts/test_migration.py
      - name: Remove isolated test database
        if: always()
        run: docker stop nfl-roi-migration-test || true
