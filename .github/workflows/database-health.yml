name: Supabase database health

on:
  workflow_dispatch:
  schedule:
    # Real database activity independent of NFL extraction failures.
    - cron: '41 */6 * * *'

permissions:
  contents: read

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install supabase python-dotenv loguru pandas
      - run: python -m etl.healthcheck
