name: Initialize validated cloud history
on:
  workflow_dispatch:
    inputs:
      season:
        description: Completed season to initialize (one season per run)
        required: true
        type: choice
        options: ['2021', '2022', '2023', '2024', '2025']
permissions:
  contents: read
concurrency:
  group: roster-roi-history
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CODE_REVISION: ${{ github.sha }}
      HISTORY_SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Archive the current database before initializing history
        run: python -m etl.backup
      - name: Build and archive completed-season inputs
        run: python -m etl.cloud bootstrap --season "$HISTORY_SEASON" --exclusions "infra/coverage/$HISTORY_SEASON.json"
